name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

# Least-privilege GITHUB_TOKEN for every job (adopted from Copilot PR #2).
permissions:
  contents: read

jobs:
  # Fast, standalone frontend compile gate. Runs `tsc -b` via the build, so
  # strict-mode type errors fail here in ~2 minutes instead of surfacing (or
  # hiding) inside the much slower e2e job.
  frontend-build:
    name: Frontend build (tsc -b + vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # Dependency vulnerability gates. Baselines are clean as of 2026-07 (Django
  # 5.2 LTS, cryptography 48, simplejwt 5.5, pytest 9), so these enforce.
  # The frontend gate covers production dependencies only; the rationale and
  # the currently-accepted dev-tooling advisories are in docs/DEPLOYMENT.md.
  security-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit backend dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --no-deps

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Scoped to production dependencies: those are what ships in the bundle
      # and reaches a user's browser. Dev-only tooling (vite, esbuild) is
      # audited below without blocking — its advisories describe the local dev
      # server, which is not an artefact we deploy.
      - name: Audit frontend production dependencies (npm audit, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Informational: surfaces dev-tooling advisories in the log so they stay
      # visible and get upgraded deliberately, rather than being invisible.
      # Does not gate — see the note above.
      - name: Audit frontend dev dependencies (informational)
        if: always()
        working-directory: frontend
        run: npm audit --audit-level=high || true

  test:
    name: Run test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowforge_test
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          DJANGO_SECRET_KEY: ci-insecure-secret-key-not-used-in-production
          DATABASE_URL: postgres://flowforge:flowforge@localhost:5432/flowforge_test
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate

      - name: Run tests with coverage
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          DJANGO_SECRET_KEY: ci-insecure-secret-key-not-used-in-production
          DATABASE_URL: postgres://flowforge:flowforge@localhost:5432/flowforge_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/htmlcov/

  rules-service-tests:
    name: Run rules-service tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rules-service/requirements.txt

      - name: Install rules-service dependencies
        working-directory: rules-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run rules-service tests
        working-directory: rules-service
        run: pytest -q

  e2e-tests:
    name: Run E2E smoke + core tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowforge_test
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-insecure-secret-key-not-used-in-production
      DATABASE_URL: postgres://flowforge:flowforge@localhost:5432/flowforge_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate and seed the database
        working-directory: backend
        run: |
          python manage.py migrate
          python manage.py seed --testrail

      - name: Start the API server
        working-directory: backend
        run: |
          gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health/ && break || sleep 1; done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and preview the frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000/api
        run: |
          npm run build
          npm run preview -- --port 5173 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ && break || sleep 1; done

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke + core tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_BASE: http://localhost:8000/api
          # @wip marks scenarios whose steps aren't implemented yet; drop the
          # tag from a scenario as its steps land.
          E2E_TAGS: "@smoke or (@core and not @wip)"
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
