# The original FlowForge demo set, ported from `manage.py seed --testrail`.
#
# This exists as the safety net for load_app (docs/DEMO-PHASE1.md §3 step 1):
# if the loader can reproduce the demo the Python seed produces, it's
# trustworthy for new content. The files were generated by exporting the
# seeded workflows through export_dsl, so they are the round-trip's own
# output rather than hand-transcribed.
#
# Identity is deliberately absent: this set is the stock FlowForge demo and
# shouldn't rebrand the workspace. Run with --skip-identity, or just note
# that omitting `name` leaves the workspace untouched.
name: FlowForge
tagline: Workflow Automation

workflows:
  - employee-leave-request.yaml
  - insurance-claim.yaml
  - test-run.yaml
  - bug-report.yaml
  - release.yaml
